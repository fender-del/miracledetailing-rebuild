<!-- ============ 30 · DRY ICE: −78.5°C ============
     Dry ice's own block (Fender 06/10, picked over a car diagram and a
     price estimator). v0.5's three mechanisms, played by the scroll on
     one drawing: I pellets fly from the gun and strike the grime; II the
     cold hits (frost, cracks, the readout falls to −78.5°C); III the
     pellets turn to gas, the grime flakes away and the bare metal
     shines. The drawing stays in view (CSS sticky, no pin) while the
     three beats scroll past it; the beat on screen lights up.
     07/10: redrawn on a canvas (motion/cold.js); without JS a still
     rendered from it (assets/img/cold-still.webp, tools: render the
     canvas with reduced motion), the beats as plain text. The drawing
     is decorative (aria-hidden); the beats carry the words. -->
<section class="cold sec" id="{{coldId}}{{^coldId}}science{{/coldId}}" data-section="cold" data-cold>
  <div class="wrap">
    <div class="sec-head cold__head">
      <p class="eyebrow" data-reveal><span class="eyebrow__mark"></span>{{&coldEyebrow}}</p>
      <h2 class="disp h2" data-split>{{&coldTitle}}</h2>
    </div>

    <div class="cold__grid">
      <div class="cold__stage" aria-hidden="true">
        <div class="cold__read">
          <p class="cold__deg"><span data-cold-deg>−78.5</span><span class="cold__unit">°C</span></p>
          <p class="cold__phase" data-cold-phase>On contact</p>
        </div>
        <img class="cold__still" src="/assets/img/cold-still.webp" width="1400" height="875" alt="" loading="lazy" decoding="async">
        <ol class="cold__dots"><li class="is-on"></li><li></li><li></li></ol>
      </div>

      <ol class="cold__beats" role="list">
        {{#beats}}
        <li class="cold__beat" data-cold-beat>
          <p class="cold__n">{{n}}</p>
          <h3 class="cold__name disp">{{name}}</h3>
          <p class="cold__sub">{{sub}}</p>
          <p class="cold__text">{{text}}</p>
        </li>
        {{/beats}}
      </ol>
    </div>
  </div>
</section>
