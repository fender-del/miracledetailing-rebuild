<!-- ============ 30 · DRY ICE: THREE MECHANISMS ============
     v0.5's three mechanisms (Kinetic Energy, Thermal Shock, Sublimation)
     beside one of Paul's own before/after pairs.
     13/10 (Paul, via Fender): the drawn demo (a canvas of a lance,
     pellets and grime, motion/cold.js, 06–07/10) is gone: Paul wants
     the real thing. In its place, Paul's own before/after collages from
     his Drive ("Dry ice before n after"), cut at their dividers and
     labelled here. Round 2 the same day (Fender): all four jobs, each
     turning over to the next as the beats are read (motion/cold.js).
     Desktop: the pair stays in view beside the beats; tablets and
     phones: the pair held under the section bar, a fifth of the screen
     high, while the beats pass beneath. Without JS: the first job.
     coldJobs = [{ before, after, cap, on }] (frames + caption). -->
<section class="cold sec" id="{{coldId}}{{^coldId}}science{{/coldId}}" data-section="cold">
  <div class="wrap">
    <div class="sec-head cold__head">
      <p class="eyebrow" data-reveal><span class="eyebrow__mark"></span>{{&coldEyebrow}}</p>
      <h2 class="disp h2" data-split>{{&coldTitle}}</h2>
    </div>

    <div class="cold__grid">
      <figure class="cold__pair" data-cold data-reveal>
        <div class="cold__ph">{{#coldJobs}}<div class="cold__f{{#on}} is-on{{/on}}">{{&before}}</div>{{/coldJobs}}<span class="cold__tag">Before</span></div>
        <div class="cold__ph">{{#coldJobs}}<div class="cold__f{{#on}} is-on{{/on}}">{{&after}}</div>{{/coldJobs}}<span class="cold__tag cold__tag--after">After</span></div>
        <figcaption class="cold__cap">
          {{#coldMulti}}<span class="cold__count" aria-hidden="true"><b data-cold-n>01</b> / {{coldCount}}</span>{{/coldMulti}}
          <span class="cold__caps">{{#coldJobs}}<span class="cold__c{{#on}} is-on{{/on}}">{{&cap}}</span>{{/coldJobs}}</span>
          {{#coldMulti}}<span class="cold__ticks" aria-hidden="true">{{#coldJobs}}<i{{#on}} class="is-on"{{/on}}></i>{{/coldJobs}}</span>{{/coldMulti}}
        </figcaption>
      </figure>

      <ol class="cold__beats" role="list">
        {{#beats}}
        <li class="cold__beat" data-reveal>
          <p class="cold__n">{{n}}</p>
          <h3 class="cold__name disp">{{name}}</h3>
          <p class="cold__sub">{{sub}}</p>
          <p class="cold__text">{{text}}</p>
        </li>
        {{/beats}}
      </ol>
    </div>
  </div>
</section>
