<!-- ============ 32 · SERVICE: STATEMENT ============
     One paragraph of Paul's, set large (PPF: "since 2006… 30+ years").
     The words light up one after another as the paragraph scrolls
     through (motion/ppf.js); without motion it is simply all lit. -->
<section class="sstate sec" id="{{statement.id}}" data-section="statement">
  <div class="wrap sstate__in">
    {{#statement.eyebrow}}<p class="eyebrow" data-reveal><span class="eyebrow__mark"></span>{{statement.eyebrow}}</p>{{/statement.eyebrow}}
    <p class="sstate__text" data-lit>{{&statement.text}}</p>
  </div>
</section>
